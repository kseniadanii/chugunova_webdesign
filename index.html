<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персональный Дашборд</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="header">
        <h1>📊 Мой Персональный Дашборд</h1>
        <p class="subtitle">Управляйте своими задачами, цитатами, погодой и новостями</p>
    </header>

    <div class="controls">
        <h2>Добавить виджет:</h2>
        <div class="buttons-row">
            <button class="btn btn-todo" data-widget="todo">📋 ToDo Список</button>
            <button class="btn btn-quote" data-widget="quote">💬 Цитата дня</button>
            <button class="btn btn-weather" data-widget="weather">🌤 Погода</button>
            <button class="btn btn-news" data-widget="news">📰 Новости</button>
        </div>
    </div>

    <div id="dashboard" class="dashboard-grid"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
